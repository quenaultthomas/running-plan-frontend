name: Cypress E2E

on:
  pull_request:
    branches:
      - main

jobs:
  cypress-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress E2E tests
        run: npx cypress run --config baseUrl=$CYPRESS_BASE_URL
        env:
          CYPRESS_BASE_URL: ${{ vars.CYPRESS_BASE_URL || 'https://yours-running-plan-staging.netlify.app' }}
          CYPRESS_API_URL: ${{ secrets.CYPRESS_API_URL || 'https://web-staging-2686.up.railway.app' }}
          CYPRESS_TEST_USERNAME: ${{ secrets.CYPRESS_TEST_USERNAME }}
          CYPRESS_TEST_PASSWORD: ${{ secrets.CYPRESS_TEST_PASSWORD }}

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7
