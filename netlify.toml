[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker files are real files in dist/ — Netlify serves them directly
# before applying the SPA redirect, so no interference.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache"

[build]
  command = "npm run build"
  publish = "dist"
